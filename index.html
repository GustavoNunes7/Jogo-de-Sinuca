<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎱 SINUCA PRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎱 SINUCA PRO</h1>
        <div class="info">
            <span>Jogador: <strong id="score">0</strong></span>
            <button id="reset">Nova Partida</button>
        </div>
    </header>

    <main>
        <div class="game-container">
            <canvas id="poolTable"></canvas>

            <div class="power-container">
                <label for="power">Força da tacada</label>
                <input type="range" id="power" min="5" max="30" value="15">
            </div>

            <p class="instructions">
                🖱️ Mire com o mouse • Clique e arraste para definir a força • Solte para tacar
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
